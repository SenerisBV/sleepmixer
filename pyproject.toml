[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepmix"
version = "0.1.0"
description = "Turn a song into an extended, disintegrating ambient sleep mix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Seneris" }]
keywords = ["audio", "ambient", "sleep", "dsp", "stem-separation", "disintegration"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pedalboard>=0.9",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Higher-quality stages — install when you want real stems / artefact-free stretch.
separation = ["demucs>=4.0", "torch>=2.0"]
analysis = ["librosa>=0.10"]
stretch = ["pyrubberband>=0.3"]  # also needs the `rubberband` CLI on PATH
all = ["demucs>=4.0", "torch>=2.0", "librosa>=0.10", "pyrubberband>=0.3", "soxr>=0.3"]
dev = ["pytest>=7.4"]

[project.scripts]
sleepmix = "sleepmix.cli:main"

[tool.setuptools]
packages = ["sleepmix"]

[tool.setuptools.package-data]
sleepmix = ["config.example.yaml"]
