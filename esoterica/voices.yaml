# Esoterica voices: providers, audition candidates, and the chosen voice per slot.
#
# A *slot* is the show name for a show with one recurring host (sideline,
# stations, lessons, meditations, shuffles) or the recording id for a show of
# different people (testimonies, addresses), so no testimony or address ever
# repeats a voice. See `voice_slot` in sleepmix/esoterica/voicing.py.
#
# Everything under `providers:` was read from the providers' live docs and APIs
# on 2026-11-03 (sources in the Task 3 report). Numbers marked PLACEHOLDER are
# Claude's choices, recorded in docs/project-state.md.
#
# No voice here is a clone of, or named after, a real person: premade voices,
# first-name-only library voices, and Cartesia stock voices only.

providers:
  elevenlabs:
    model: eleven_v4            # "most emotive"; GET /v1/models lists it, 10,000-char limit, French
    price_per_char: 0.00008     # USD, API rate card ($0.08 per 1K characters for Eleven v4)
    credits_per_char: 1.0       # /v1/models: character_cost_multiplier 1.0 (the 265k-credit budget)
    max_chars: 10000            # /v1/models: maximum_text_length_per_request
    output_format: pcm_24000    # raw S16LE mono; pcm_44100 needs the Pro tier, so resample instead
    settings:                   # PLACEHOLDERS (intimacy recipe)
      stability: 0.5            # below "robust"; valid whether v4 takes 0/0.5/1 steps or a range
      similarity_boost: 0.75    # provider default
      speed: 0.85               # slower than default 1.0 (docs floor 0.7); eleven_v4 IGNORES it (measured 2026-11-03)
  cartesia:
    model: sonic-3.6            # current Sonic, "fastest, most natural"; French supported
    price_per_char: 0.00005     # USD, UNVERIFIED: docs say ~1 credit/char; $/credit is third-party (Pro $5 / 100K)
    credits_per_char: 1.0       # docs: "approximately 1 credit per character"
    max_chars: 1000             # PLACEHOLDER: the docs state no transcript limit; conservative
    settings:                   # PLACEHOLDERS (intimacy recipe)
      speed: 0.8                # docs: speed is guidance, use large steps (0.6-1.5)
      emotion: calm             # English only per docs; omitted for French

