<!doctype html>
<meta charset="utf-8">
<title>sleepmix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Every class the Elm views emit has a rule here, and the list is the whole
     point: `.progress-fill` is an empty div carrying only an inline width, so
     without a height and a colour the live progress bar this interface exists
     to show renders as literally nothing. Plain and legible rather than
     designed — this is a local tool, and the job is to make state visible.
     `tests/test_static_bundle.py` scans ui/src for class names and fails on
     any that has no rule here, because nobody who writes this can see it. */
  :root { color-scheme: dark; --bg: #17181b; --fg: #ddd; --dim: #8b8f98;
          --line: #2a2d33; --accent: #7aa2f7;
          accent-color: #7aa2f7; }
  * { box-sizing: border-box; }
  body { font: 15px/1.55 system-ui, -apple-system, sans-serif;
         margin: 0; color: var(--fg); background: var(--bg); }
  .app { max-width: 62rem; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
  h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; margin: 0 0 1.5rem; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .25rem; }
  /* `h3` is deliberately not styled — it is `Stems`, and the browser default
     is the size that heading wants. `h4` is `Decay`, above the `stem_decay`
     description, and it needs a rule: at the browser default it is the same
     1rem as body text, so the paragraph under it would go on reading as a
     continuation of the one above rather than as a new subject. Smaller than
     `h3`, above a tighter gap than the description below it gets. */
  h4 { font-size: .95rem; font-weight: 600; letter-spacing: .02em;
       margin: 1.2rem 0 .15rem; }
  p { margin: .4rem 0; }
  .error { color: #f7768e; }
  .dim { color: var(--dim); }

  button { font: inherit; color: var(--fg); background: #22242a;
           border: 1px solid var(--line); border-radius: 5px;
           padding: .4rem .85rem; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { cursor: default; opacity: .5; }
  input, select { font: inherit; color: var(--fg); background: #101115;
          border: 1px solid var(--line); border-radius: 5px;
          padding: .4rem .6rem; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  /* One rule, not two: an `input:disabled` rule as well would compound with
     this one and render the control at .20 against its own label at .45. The
     whole row dims together, because "inert until the first preview returns"
     is a statement about the row, not about the widget.
     Scoped to `.field` — the control and its label — and deliberately NOT to
     the `.field-group` that also holds the schema's line about the control.
     `.field-help` is already `--dim` (#8b8f98); at .45 over `--bg` that
     composites to #4b4e53, **2.13:1** where the undimmed line is 5.48:1, on
     .85rem (12.75px) text that AA wants at 4.5:1 and AA-large at 3:1. And
     `Wiring.enabled` is `Preview.isPlayable`, false in `Cold` and `Warming`,
     so the whole panel is inert until the first preview returns — minutes for
     a cold song, and the one stretch in which the reader has nothing to do
     BUT read these lines. Dimming the explanation exactly when it is the only
     thing on screen worth reading is the trade this rule refuses.
     What that costs: the help stays at full `--dim` beside a dimmed control,
     so an inert row is not uniformly grey. That is the intended reading — the
     control is unavailable, the sentence explaining it is not. There is no
     compounding to fear either: `.field-help` is a SIBLING of `.field`, not a
     descendant, so `.field:has(:disabled)` can never reach it. */
  .field:has(:disabled) { opacity: .45; }
  /* The base rule above is for text boxes; a checkbox or a slider wearing a
     border and .4rem of padding is a different control that happens to be an
     <input>. */
  input[type=checkbox] { width: auto; padding: 0; border: none;
                         vertical-align: -.1em; }
  input[type=range] { padding: 0; border: none; background: none;
                      height: 1.4rem; cursor: pointer; }
  summary { cursor: pointer; color: var(--dim); padding: .35rem 0; }
  summary:hover { color: var(--fg); }

  /* Library */
  .library { margin-top: 1rem; }
  .import { display: flex; gap: .5rem; margin: .75rem 0 1.5rem; }
  .import input { flex: 1; min-width: 0; }
  .songs { list-style: none; margin: 0; padding: 0;
           border-top: 1px solid var(--line); }
  .songs .song { display: flex; gap: 1rem; align-items: baseline;
                 padding: .6rem .5rem; border-bottom: 1px solid var(--line);
                 cursor: pointer; }
  .songs .song:hover { background: #1d1f24; }
  .songs .song .title { flex: 1; min-width: 0; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }

  /* Song view */
  /* Both screens, named. `.back` is emitted by `.song-view` and by `.mixer`,
     and this rule was scoped to the first only — so the mixer's back button
     had no margin at all and sat against the title. The class-coverage test
     cannot catch that: it proves a rule exists somewhere for a class, not that
     the rule applies where the class is emitted.
     Left scoped rather than made a bare `.back` because `.song-view` has no
     other rule, and dropping the scope would leave that class styling nothing
     — trading this blind spot for the one the coverage test does catch. A
     third screen with a back button needs a third selector here.
     The renders screen is that third one, added below with its own screen, and
     the queue screen is the fourth. Every screen with a back button must be
     named here; the class-coverage test will not notice a missing one. */
  .song-view .back, .mixer .back, .renders .back,
  .queue .back { margin-bottom: 1.25rem; }
  .waveform { display: block; width: 100%; margin: 1rem 0 1.5rem;
              background: #101115; border: 1px solid var(--line);
              border-radius: 5px; }
  .separation { border-top: 1px solid var(--line); padding-top: 1rem; }
  .separation button { margin-top: .75rem; }

  /* The bar. `.progress-fill` is an empty div whose only other attribute is an
     inline `width: N%`, so the height, the colour and the track it sits in all
     have to come from here or there is nothing on screen at all. */
  .progress { display: flex; align-items: center; gap: .75rem; margin: .75rem 0; }
  .progress-track { flex: 1; height: 6px; border-radius: 3px;
                    background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent);
                   transition: width .2s linear; }

  .mixer-entry { border-top: 1px solid var(--line); margin-top: 1.5rem;
                 padding-top: 1rem; }
  .mixer-entry p { margin-top: .6rem; }

  /* The mixer. Quiet on purpose: this is a screen you sit in front of at
     midnight deciding what to fall asleep to, so nothing on it should be
     louder than the waveform. */
  .mixer h2 { margin-bottom: 1rem; }
  .mixer .waveform { margin-bottom: .5rem; }

  /* The preset bar, from `Page.Mixer.presetBar`. Emitted inside
     `div [ class "mixer" ]`, directly under the waveform caption and above the
     arc — read these selectors against that markup rather than against the
     class-coverage test, which proves a rule exists somewhere and not that it
     applies where the class is emitted (`.back` needed four scopes for exactly
     that reason). Left unscoped throughout because nothing but the mixer emits
     any of them, and because two of them are `<p>` elements that also carry
     `.dim` or `.error`, which are 0-1-0 and must keep winning where they say
     something these do not. */
  .presets { border-top: 1px solid var(--line); margin-top: 1.25rem;
             padding-top: 1rem; }
  .presets p { margin: .35rem 0; max-width: 46rem; }
  .preset-row { display: flex; align-items: center; gap: .5rem;
                flex-wrap: wrap; margin: .4rem 0; }
  .preset-label { color: var(--dim); flex: 0 0 6rem; }
  /* The same width for both, so the name box lines up under the select and the
     two rows read as one control panel rather than as two. */
  .preset-select, .preset-name { flex: 0 1 16rem; min-width: 0; }
  .preset-apply, .preset-last-apply, .preset-save, .preset-save-over,
  .preset-delete, .preset-go, .preset-keep { font-size: .85rem;
                                             padding: .2rem .6rem; }
  /* Apply is the one control here that moves every other control on the
     screen, so it carries the accent exactly as the Render button does. The
     rest of the bar stays quiet. */
  .preset-apply, .preset-last-apply { border-color: var(--accent);
                                      color: var(--accent); }
  /* Amber, and the same amber as `.warn`: nothing has gone wrong, but what the
     next click does cannot be undone. */
  .preset-confirm { display: flex; align-items: center; gap: .5rem;
                    flex-wrap: wrap; color: #e0af68; }
  .preset-question { flex: 1 1 20rem; min-width: 0; }
  .preset-last { display: flex; align-items: center; gap: .5rem;
                 flex-wrap: wrap; color: var(--dim); }
  .preset-last-name { color: var(--fg); font-weight: 600; letter-spacing: .02em; }
  /* Shown when the mixer opened before `GET /api/config/default` answered, or
     after it failed. Amber for the same reason the confirm is: the mixer works
     and is honest about what it shows — it simply did not start where the
     tool's own defaults start. */
  .mixer-defaults { color: #e0af68; font-size: .9rem; }

  .arc { border-top: 1px solid var(--line); margin-top: 1.25rem;
         padding-top: 1rem; }
  .arc-row { display: flex; align-items: center; gap: 1rem; }
  .arc-label { color: var(--dim); flex: 0 0 6rem; }
  .arc-scrub { flex: 1; min-width: 0; }
  .arc-value { flex: 0 0 15rem; text-align: right; color: var(--dim);
               font-variant-numeric: tabular-nums; }

  /* Nothing behind the first preview reports progress — it is one long call
     holding a per-song lock — so this bar is deliberately indeterminate: it
     says the page is alive and claims nothing about how far along the work
     is. A filled fraction here would be an invented number. */
  .preparing { margin: .5rem 0 1rem; }
  .preparing-track { height: 4px; border-radius: 2px; background: var(--line);
                     overflow: hidden; margin-bottom: .75rem; }
  .preparing-fill { height: 100%; width: 28%; border-radius: 2px;
                    background: var(--accent); opacity: .8;
                    animation: drift 2.4s ease-in-out infinite; }
  @keyframes drift {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .preparing-fill { animation: none; width: 100%; opacity: .35; }
  }

  .preview-error { display: flex; align-items: center; gap: .75rem;
                   flex-wrap: wrap; margin: .5rem 0; }

  .stems { margin-top: 1.75rem; }
  .stem-row { border-top: 1px solid var(--line); padding: .9rem 0; }
  .stem-head { display: flex; align-items: baseline; gap: 1rem; }
  .stem-name { flex: 1; font-weight: 600; letter-spacing: .02em; }
  .solo { font-size: .85rem; padding: .2rem .6rem; }
  .solo-on { color: var(--accent); border-color: var(--accent);
             background: #1b2334; }

  .settings { margin-top: 2rem; border-top: 1px solid var(--line); }
  .section { border-bottom: 1px solid var(--line); }
  .section-note { color: var(--dim); font-size: .9rem;
                  margin: 0 0 .6rem; max-width: 46rem; }
  .decay { margin-top: .6rem; }

  /* What a section is *for*, in the server's own words — `config_schema` sends
     each dataclass's docstring and `Page.Mixer.descriptionBlock` renders it as
     the paragraphs it was written in. Emitted in two places, so deliberately
     unscoped: inside `details.section` between the summary and the controls,
     and inside `.stems` above the stem rows, where the `stem` and `stem_decay`
     sections are described once each rather than once per row. Read against
     both, not against the class-coverage test, which proves a rule exists
     somewhere and not that it applies where the class is emitted.
     Dim but not smaller: this is the sentence you read to decide whether this
     is the section you wanted, and it sits above a `.section-note` set at
     .9rem, so the size difference is what orders the two.
     `.section-description p` is 0-1-1 and beats the page's own `p` margin; it
     cannot reach `.field-help`, which is never inside one of these. */
  .section-description { color: var(--dim); max-width: 46rem;
                         margin: .1rem 0 .7rem; }
  .section-description p { margin: .3rem 0; }

  /* Two columns where there is room for two, one where there is not. Every
     control is generated from /api/schema, so the number of rows here is
     whatever the server currently describes. What the grid places is
     `.field-group` — one control with the schema's line about it underneath —
     rather than `.field` itself, so that line lands under its own control
     instead of in the next column. */
  .fields { display: grid; gap: .35rem 2rem; margin: .5rem 0 .25rem;
            grid-template-columns: repeat(auto-fit, minmax(21rem, 1fr)); }
  .field-group { min-width: 0; }
  /* The schema's own line about one control, under that control. It was an
     `Attr.title` until this branch: a tooltip, which is nothing at all on a
     touchscreen, nothing to a keyboard, and nothing to anyone not hovering the
     exact element. Narrower than the control column is wide, because a line
     that runs the full width of a two-column grid reads as prose rather than
     as a caption on the row above it. A good many fields have no help at all —
     `Gain`, `Fade in`, `Room size` and the like, whose labels already say what
     they do — and those emit no `<p>`, so they gain no height from this. */
  .field-help { color: var(--dim); font-size: .85rem; line-height: 1.45;
                margin: .05rem 0 .45rem; max-width: 34rem; }
  .field { display: flex; align-items: center; gap: .6rem; min-width: 0;
           padding: .1rem 0; }
  .field-check { cursor: pointer; }
  .field-label { color: var(--dim); flex: 0 0 9rem; }
  .field-check .field-label { flex: 0 1 auto; }
  .field-range { flex: 1; min-width: 0; }
  .field-value { flex: 0 0 5.5rem; text-align: right;
                 font-variant-numeric: tabular-nums; }
  .field-box { flex: 0 1 7rem; min-width: 0; }
  .field-select { flex: 0 1 12rem; min-width: 0; }

  /* Starting a render, from the mixer. Emitted by `Page.Mixer.renderPanel`
     inside `div [ class "mixer" ]`, directly under the arc — read these
     against that markup rather than against the class-coverage test, which
     proves a rule exists somewhere and not that it applies where the class is
     emitted. Left unscoped because nothing else emits `.render-start`, and
     because `.renders .render-*` is a different screen entirely: every rule
     there is scoped under `.renders`, so none of them reaches this. */
  .render-start { border-top: 1px solid var(--line); margin-top: 1.25rem;
                  padding-top: 1rem; }
  /* Even spacing above and below every paragraph in the panel, because two of
     the four sit *after* the button — the reason it cannot be pressed, and the
     failure if the POST came back an error. */
  .render-start p { margin: .35rem 0; max-width: 46rem; }
  /* The one control on this screen that produces a file, so it carries the
     accent rather than sitting in the same grey as a section header. */
  .render-go { margin-top: .5rem; border-color: var(--accent); color: var(--accent); }

  /* The long-source warning, from `Warn.forSource`. Emitted on two screens —
     inside `.render-start` on the mixer and inside `.separation` on the song
     view — so it is deliberately unscoped: the whole reason `Warn` is one
     module is that both screens say the same thing about the same single
     worker, and a rule scoped to one of them would have them look different
     while saying it. Amber rather than the error red: nothing has gone wrong,
     and this does not disable anything. */
  .warn { color: #e0af68; max-width: 46rem; }

  /* The way out of the library and into anything that is not a song. One rule
     for the strip; the buttons in it are ordinary buttons. */
  .nav { display: flex; gap: .5rem; margin-bottom: 1rem; }

  /* Renders. Six mixes of the same song carry the same title, so the row is
     built around what tells them apart: the length, the stems and where the
     decay ends. The whole config folds out underneath.
     Every selector here is scoped under `.renders` except the four generic
     ones at the end (`.download`, `.delete`, `.cancel`, and the progress bar,
     which is shared with the separation panel) — the mistake this file has
     already made once is a rule scoped to the screen it was written for and a
     class emitted on a different one. */
  .renders h2 { margin-bottom: 1rem; }
  .renders .render-list { border-top: 1px solid var(--line); }
  .renders .render-row { border-bottom: 1px solid var(--line); padding: .9rem .25rem; }
  .renders .render-head { display: flex; align-items: baseline; gap: 1rem; }
  .renders .render-title { flex: 1; min-width: 0; font-weight: 600;
                           letter-spacing: .02em; overflow: hidden;
                           text-overflow: ellipsis; white-space: nowrap; }
  .renders .render-status { color: var(--dim); }
  /* Its own class rather than reusing `.error`, and the reason is specificity
     rather than order: `.error` is 0-1-0 and `.renders .render-status` is
     0-2-0, so `.error` on a status span loses wherever this file states it —
     moving it later would not help. A failed render reading in the same grey
     as a queued one is exactly the kind of silence the rest of this interface
     is built to avoid, so the colour is carried by a class scoped the same way
     the status is. */
  .renders .render-bad { color: #f7768e; }
  .renders .render-when { color: var(--dim); font-variant-numeric: tabular-nums;
                          font-size: .9rem; white-space: nowrap; }
  .renders .render-summary { display: flex; flex-wrap: wrap; gap: .2rem 1.25rem;
                             color: var(--dim); font-size: .9rem;
                             margin: .3rem 0 .5rem; }
  .renders .render-fact { white-space: nowrap; }
  .renders .render-actions { display: flex; align-items: center; gap: .75rem;
                             flex-wrap: wrap; margin: .5rem 0; }
  /* The audition. A plain <audio controls> streaming from
     /api/renders/{id}/audio — half an hour of WAV is ~300 MB decoded, which is
     what the Web Audio port would do to loop it, and this needs no JavaScript
     at all. Height comes from the browser's own controls; only the width is
     ours, so it does not stretch to the full page on a wide window. */
  .renders .render-audio { display: block; width: 100%; max-width: 34rem;
                           margin: .5rem 0 .25rem; }
  .renders .render-config { margin-top: .4rem; }
  .renders .render-json { margin: .25rem 0 0; padding: .6rem .75rem;
                          background: #101115; border: 1px solid var(--line);
                          border-radius: 5px; color: var(--dim);
                          font-size: .82rem; line-height: 1.45;
                          max-height: 22rem; overflow: auto;
                          white-space: pre; }

  /* Queue. One worker runs every separation and every render, so this is a
     single column read top to bottom: what is running, what is behind it, what
     recently ended. Nothing here competes with anything else for attention —
     the ordering is the information, and the only loud thing on the screen is
     a red status on a job that failed.
     Scoped under `.queue` throughout, except the progress bar (shared with the
     separation panel and the renders screen) and `.cancel` (shared with the
     renders screen) — both of which have their own unscoped rules already.
     Read these against `ui/src/Page/Queue.elm`'s markup, not just against the
     class-coverage test: that test proves a rule exists somewhere, not that it
     applies where the class is emitted. */
  .queue h2 { margin-bottom: .5rem; }
  .queue .queue-list { border-top: 1px solid var(--line); margin-top: 1.25rem; }
  .queue .queue-row { border-bottom: 1px solid var(--line); padding: .8rem .25rem; }
  .queue .queue-head { display: flex; align-items: baseline; gap: 1rem; }
  /* Fixed width so the kinds line up down the column and the eye can skip
     them: which job is a render and which a separation matters less than what
     order they are in. */
  /* Clipped rather than allowed to push the title along: `kind` is the one
     field on a job that is a plain string rather than a closed union, so a kind
     this build has never heard of is shown verbatim and could be any length. */
  .queue .queue-kind { flex: 0 0 5.5rem; min-width: 0; color: var(--dim);
                       font-size: .9rem; letter-spacing: .02em;
                       overflow: hidden; text-overflow: ellipsis;
                       white-space: nowrap; }
  .queue .queue-title { flex: 1; min-width: 0; font-weight: 600;
                        letter-spacing: .02em; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
  .queue .queue-status { color: var(--dim); white-space: nowrap; }
  /* Its own class rather than reusing `.error`, for the reason `.render-bad`
     gives: `.error` is 0-1-0 and `.queue .queue-status` is 0-2-0, so `.error`
     on a status span loses on specificity wherever it is stated, and a failed
     job would read in the same grey as a waiting one. */
  .queue .queue-bad { color: #f7768e; }
  .queue .queue-when { color: var(--dim); font-variant-numeric: tabular-nums;
                       font-size: .9rem; white-space: nowrap; }
  /* The cancel button is absent rather than disabled on a job that has ended,
     so this row is often just the sentence — it wraps, and carries no height
     of its own beyond what is in it. */
  .queue .queue-actions { display: flex; align-items: center; gap: .75rem;
                          flex-wrap: wrap; margin: .4rem 0 0; }

  /* Emitted inside `.render-actions` today and deliberately left unscoped:
     these describe a kind of action rather than a screen, and the next screen
     with a Cancel button should not need a fourth selector written for it. */
  .download { color: var(--accent); text-decoration: underline;
              text-underline-offset: .2em; }
  .download:hover { color: var(--fg); }
  .delete, .cancel { font-size: .85rem; padding: .2rem .6rem; }
</style>
<div id="app"></div>
<script src="/static/app.js"></script>
<script type="module">
  import { wire as wireEvents } from "/static/events.js";
  import { wire as wireAudio } from "/static/audio.js";
  const app = Elm.Main.init({ node: document.getElementById("app") });
  wireEvents(app);
  wireAudio(app);
</script>
