<!doctype html>
<meta charset="utf-8">
<title>sleepmix</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Every class the Elm views emit has a rule here, and the list is the whole
     point: `.progress-fill` is an empty div carrying only an inline width, so
     without a height and a colour the live progress bar this interface exists
     to show renders as literally nothing. Plain and legible rather than
     designed — this is a local tool, and the job is to make state visible.
     `tests/test_static_bundle.py` scans ui/src for class names and fails on
     any that has no rule here, because nobody who writes this can see it. */
  :root { color-scheme: dark; --bg: #17181b; --fg: #ddd; --dim: #8b8f98;
          --line: #2a2d33; --accent: #7aa2f7;
          accent-color: #7aa2f7; }
  * { box-sizing: border-box; }
  body { font: 15px/1.55 system-ui, -apple-system, sans-serif;
         margin: 0; color: var(--fg); background: var(--bg); }
  .app { max-width: 62rem; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
  h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: .02em; margin: 0 0 1.5rem; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .25rem; }
  p { margin: .4rem 0; }
  .error { color: #f7768e; }
  .dim { color: var(--dim); }

  button { font: inherit; color: var(--fg); background: #22242a;
           border: 1px solid var(--line); border-radius: 5px;
           padding: .4rem .85rem; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { cursor: default; opacity: .5; }
  input, select { font: inherit; color: var(--fg); background: #101115;
          border: 1px solid var(--line); border-radius: 5px;
          padding: .4rem .6rem; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  /* One rule, not two: an `input:disabled` rule as well would compound with
     this one and render the control at .20 against its own label at .45. The
     whole row dims together, because "inert until the first preview returns"
     is a statement about the row, not about the widget. */
  .field:has(:disabled) { opacity: .45; }
  /* The base rule above is for text boxes; a checkbox or a slider wearing a
     border and .4rem of padding is a different control that happens to be an
     <input>. */
  input[type=checkbox] { width: auto; padding: 0; border: none;
                         vertical-align: -.1em; }
  input[type=range] { padding: 0; border: none; background: none;
                      height: 1.4rem; cursor: pointer; }
  summary { cursor: pointer; color: var(--dim); padding: .35rem 0; }
  summary:hover { color: var(--fg); }

  /* Library */
  .library { margin-top: 1rem; }
  .import { display: flex; gap: .5rem; margin: .75rem 0 1.5rem; }
  .import input { flex: 1; min-width: 0; }
  .songs { list-style: none; margin: 0; padding: 0;
           border-top: 1px solid var(--line); }
  .songs .song { display: flex; gap: 1rem; align-items: baseline;
                 padding: .6rem .5rem; border-bottom: 1px solid var(--line);
                 cursor: pointer; }
  .songs .song:hover { background: #1d1f24; }
  .songs .song .title { flex: 1; min-width: 0; overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }

  /* Song view */
  .song-view .back { margin-bottom: 1.25rem; }
  .waveform { display: block; width: 100%; margin: 1rem 0 1.5rem;
              background: #101115; border: 1px solid var(--line);
              border-radius: 5px; }
  .separation { border-top: 1px solid var(--line); padding-top: 1rem; }
  .separation button { margin-top: .75rem; }

  /* The bar. `.progress-fill` is an empty div whose only other attribute is an
     inline `width: N%`, so the height, the colour and the track it sits in all
     have to come from here or there is nothing on screen at all. */
  .progress { display: flex; align-items: center; gap: .75rem; margin: .75rem 0; }
  .progress-track { flex: 1; height: 6px; border-radius: 3px;
                    background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent);
                   transition: width .2s linear; }

  .mixer-entry { border-top: 1px solid var(--line); margin-top: 1.5rem;
                 padding-top: 1rem; }
  .mixer-entry p { margin-top: .6rem; }

  /* The mixer. Quiet on purpose: this is a screen you sit in front of at
     midnight deciding what to fall asleep to, so nothing on it should be
     louder than the waveform. */
  .mixer h2 { margin-bottom: 1rem; }
  .mixer .waveform { margin-bottom: .5rem; }

  .arc { border-top: 1px solid var(--line); margin-top: 1.25rem;
         padding-top: 1rem; }
  .arc-row { display: flex; align-items: center; gap: 1rem; }
  .arc-label { color: var(--dim); flex: 0 0 6rem; }
  .arc-scrub { flex: 1; min-width: 0; }
  .arc-value { flex: 0 0 15rem; text-align: right; color: var(--dim);
               font-variant-numeric: tabular-nums; }

  /* Nothing behind the first preview reports progress — it is one long call
     holding a per-song lock — so this bar is deliberately indeterminate: it
     says the page is alive and claims nothing about how far along the work
     is. A filled fraction here would be an invented number. */
  .preparing { margin: .5rem 0 1rem; }
  .preparing-track { height: 4px; border-radius: 2px; background: var(--line);
                     overflow: hidden; margin-bottom: .75rem; }
  .preparing-fill { height: 100%; width: 28%; border-radius: 2px;
                    background: var(--accent); opacity: .8;
                    animation: drift 2.4s ease-in-out infinite; }
  @keyframes drift {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(360%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .preparing-fill { animation: none; width: 100%; opacity: .35; }
  }

  .preview-error { display: flex; align-items: center; gap: .75rem;
                   flex-wrap: wrap; margin: .5rem 0; }

  .stems { margin-top: 1.75rem; }
  .stem-row { border-top: 1px solid var(--line); padding: .9rem 0; }
  .stem-head { display: flex; align-items: baseline; gap: 1rem; }
  .stem-name { flex: 1; font-weight: 600; letter-spacing: .02em; }
  .solo { font-size: .85rem; padding: .2rem .6rem; }
  .solo-on { color: var(--accent); border-color: var(--accent);
             background: #1b2334; }

  .settings { margin-top: 2rem; border-top: 1px solid var(--line); }
  .section { border-bottom: 1px solid var(--line); }
  .section-note, .decay p { color: var(--dim); font-size: .9rem;
                            margin: 0 0 .6rem; max-width: 46rem; }
  .decay { margin-top: .6rem; }

  /* Two columns where there is room for two, one where there is not. Every
     control is generated from /api/schema, so the number of rows here is
     whatever the server currently describes. */
  .fields { display: grid; gap: .35rem 2rem; margin: .5rem 0 .25rem;
            grid-template-columns: repeat(auto-fit, minmax(21rem, 1fr)); }
  .field { display: flex; align-items: center; gap: .6rem; min-width: 0;
           padding: .1rem 0; }
  .field-check { cursor: pointer; }
  .field-label { color: var(--dim); flex: 0 0 9rem; }
  .field-check .field-label { flex: 0 1 auto; }
  .field-range { flex: 1; min-width: 0; }
  .field-value { flex: 0 0 5.5rem; text-align: right;
                 font-variant-numeric: tabular-nums; }
  .field-box { flex: 0 1 7rem; min-width: 0; }
  .field-select { flex: 0 1 12rem; min-width: 0; }
</style>
<div id="app"></div>
<script src="/static/app.js"></script>
<script type="module">
  import { wire as wireEvents } from "/static/events.js";
  import { wire as wireAudio } from "/static/audio.js";
  const app = Elm.Main.init({ node: document.getElementById("app") });
  wireEvents(app);
  wireAudio(app);
</script>
