name: Esoterica
options:
  bundleIdPrefix: nl.senerisbv
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  NightEngine:
    path: ../swift
targets:
  Esoterica:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Esoterica
        excludes:
          - Stations
          - Stations/**
      # Generated by `make stations` (git-ignored); copied into the app as-is.
      - path: Esoterica/Stations
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: NightEngine
        product: NightRadio
      - package: NightEngine
        product: NightPlan
    info:
      path: Esoterica/Info.plist
      properties:
        CFBundleDisplayName: Esoterica DM Radio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.senerisbv.esoterica
        PRODUCT_NAME: Esoterica
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
schemes:
  Esoterica:
    build:
      targets:
        Esoterica: all
    run:
      config: Debug
